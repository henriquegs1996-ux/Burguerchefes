       RESET

    * {

    }

      min-height: 100vh;

      color: #ffffff;

      background:

          #090909 58%,
          #030303 100%
        );

      overflow-x: hidden;
    }


    /* =========================
       EFEITOS DE FUNDO
    ========================= */

    body::before {
      content: "";

      position: fixed;

      width: 300px;
      height: 300px;

      top: -120px;
      left: 50%;

      transform: translateX(-50%);

      background: #e50914;

      filter: blur(130px);

      opacity: 0.18;

      pointer-events: none;
    }

       CONTAINER
    ========================= */
